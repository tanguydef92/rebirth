[workspace]
name = "gazebo-swarm-beta"
version = "0.1.0"
description = "Ten-drone kinematic swarm using Gazebo Harmonic"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
gz-sim = "8.*"
cmake = ">=3.25,<4"
python = "3.12.*"
ninja = ">=1.11"

[tasks]
build = "bash build.sh"
start = "bash run.sh"
headless = "bash run.sh --headless --iterations 1500"
test = "python -m unittest discover -s tests -v"
